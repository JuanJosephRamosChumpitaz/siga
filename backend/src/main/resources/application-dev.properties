spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pecosa?serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-123456}
app.jwt.expiracion-horas=8
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
